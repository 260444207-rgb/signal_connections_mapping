name: openclaw-loop-runner
version: 0.1.0
description: Ralph-style loop runtime plugin pattern for OpenClaw.

commands:
  - name: loop.init
    entry: scripts/openclaw_loop.py init
  - name: loop.goal
    entry: scripts/openclaw_loop.py goal
  - name: loop.plan
    entry: scripts/openclaw_loop.py plan
  - name: loop.status
    entry: scripts/openclaw_loop.py status
  - name: loop.next
    entry: scripts/openclaw_loop.py next
  - name: loop.run
    entry: scripts/openclaw_loop.py run
  - name: loop.check
    entry: scripts/openclaw_loop.py check

config:
  state_dir: .openclaw-loop
  max_iterations: 20
  max_no_progress_rounds: 3
  max_task_attempts: 3
  reset_context_each_iteration: true
  evaluator: output_contract_jsonl

middleware:
  chat_goal_intercept:
    command: loop.goal
    message_arg: --message
    noop_status: NOOP
    description: Pass each user chat message to loop.goal. If it returns NOOP, continue to the default agent. If it returns AWAITING_GOAL_PROMPT or OK, treat the message as handled by goal mode.
